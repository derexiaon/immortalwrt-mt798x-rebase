name: Debug conninfra symbol

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install minimal deps
      run: |
        sudo apt update -qq
        sudo apt install -y build-essential libncurses5-dev python3 git wget xz-utils

    - name: Clone source
      run: |
        git clone --depth=1 https://github.com/derexiaon/immortalwrt-mt798x-rebase source

    - name: Minimal config
      run: |
        cd source
        cp ../defconfig/n60pro.config .config
        make defconfig

    - name: Download and prepare conninfra only
      run: |
        cd source
        make package/mtk/drivers/conninfra/download V=sc
        make package/mtk/drivers/conninfra/prepare V=sc

    - name: Find of_device_id symbol
      run: |
        CDIR=$(find source/build_dir -maxdepth 6 -type d -name 'conninfra' | head -1)
        echo "Dir: $CDIR"
        echo '=== ALL FILES ==='
        find "$CDIR" -type f | sort
        echo '=== of_device_id in ALL files ==='
        grep -rn 'of_device_id\|MODULE_DEVICE_TABLE\|ap_conninfra' "$CDIR" \
          --include='*.h' --include='*.c' | head -40 || echo 'NOT FOUND'
        echo '=== consys_hw.h content ==='
        find "$CDIR" -name 'consys_hw.h' | xargs cat 2>/dev/null || echo 'no consys_hw.h'
        echo '=== Makefile/Kbuild check ==='
        find "$CDIR" -name 'Makefile' -o -name 'Kbuild' | \
          xargs grep -n 'ap_conninfra\|of_device_id' 2>/dev/null || echo 'NOT FOUND in Makefile'
