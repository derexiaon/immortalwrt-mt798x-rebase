name: Build N60 Pro Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        profile: [stock, mtkuboot]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt full-upgrade -y
        sudo apt install -y \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3-distutils rsync unzip \
          zlib1g-dev file wget curl

    - name: Add swap
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile /mnt/swapfile
        sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: Clone source
      run: |
        git clone --depth=1 https://github.com/derexiaon/immortalwrt-mt798x-rebase source

    - name: Update feeds
      run: |
        cd source
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load config
      run: |
        cd source
        cp ../defconfig/n60pro.config .config

        sed -i '/^CONFIG_TARGET_DEVICE_mediatek_/d' .config

        sed -i '/^CONFIG_PACKAGE_kmod-conninfra=/d' .config
        sed -i '/^CONFIG_PACKAGE_conninfra=/d' .config
        sed -i '/^CONFIG_PACKAGE_kmod-mt_wifi=/d' .config
        sed -i '/^CONFIG_PACKAGE_mt_wifi=/d' .config

        # Оставляем проприетарный Wi-Fi стек, но убираем только проблемный conninfra
        echo '# CONFIG_PACKAGE_kmod-conninfra is not set' >> .config

        if [ "${{ matrix.profile }}" = "stock" ]; then
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro=y" >> .config
        else
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro-mtkuboot=y" >> .config
        fi

        make defconfig

    - name: Verify config
      run: |
        cd source
        grep -E 'CONFIG_PACKAGE_(kmod-conninfra|conninfra|kmod-mt_wifi|mt_wifi)=' .config || true

    - name: Download packages
      run: |
        cd source
        make download -j$(nproc)

    - name: Build firmware
      run: |
        cd source
        make -j$(nproc) || make -j1 V=sc

    - name: Prepare artifact
      if: success()
      run: |
        cd source/bin/targets/*/*
        mkdir -p /tmp/artifacts
        if [ "${{ matrix.profile }}" = "stock" ]; then
          NAME="n60pro-stock"
        else
          NAME="n60pro-mtkuboot"
        fi
        cp * /tmp/artifacts/
        cd /tmp
        tar -czf firmware-${NAME}.tar.gz artifacts

    - name: Upload firmware
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.profile }}
        path: /tmp/firmware-*.tar.gz
