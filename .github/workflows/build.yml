name: Build N60 Pro Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        profile: [stock, mtkuboot]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3-distutils rsync unzip \
          zlib1g-dev file wget curl

    - name: Add swap (prevent OOM)
      run: |
        sudo swapoff -a
        sudo rm -f /swapfile /mnt/swapfile
        sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Clone source
      run: |
        git clone https://github.com/derexiaon/immortalwrt-mt798x-rebase source

    - name: Update feeds
      run: |
        cd source
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load config
      run: |
        cd source

        # КОПИРУЕМ ТВОЙ КОНФИГ
        cp ../defconfig/n60pro.config .config

        # УДАЛЯЕМ все возможные device (на всякий случай)
        sed -i '/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/d' .config

        # ВЫБИРАЕМ профиль через matrix
        if [ "${{ matrix.profile }}" = "stock" ]; then
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro=y" >> .config
        else
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro-mtkuboot=y" >> .config
        fi

        # Применяем конфиг
        make defconfig

    - name: Show selected config (debug)
      run: |
        cd source
        echo "==== DEVICE ===="
        grep netcore .config || true
        echo "==== LUCI ===="
        grep luci .config || true

    - name: Download packages
      run: |
        cd source
        make download -j$(nproc)

    - name: Build firmware
      run: |
        cd source
        make -j$(nproc) || make -j1 V=s

    - name: Prepare artifact
      run: |
        cd source/bin/targets/*/*
        mkdir -p /tmp/artifacts

        if [ "${{ matrix.profile }}" = "stock" ]; then
          NAME="n60pro-stock"
        else
          NAME="n60pro-mtkuboot"
        fi

        cp * /tmp/artifacts/

        cd /tmp
        tar -czf firmware-${NAME}.tar.gz artifacts

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.profile }}
        path: /tmp/firmware-*.tar.gz
