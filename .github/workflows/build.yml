name: Build N60 Pro Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    strategy:
      fail-fast: false
      matrix:
        profile: [stock, mtkuboot]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt full-upgrade -y
        sudo apt install -y \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang clangd cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
          gettext gcc-multilib g++-multilib git gperf haveged help2man intltool lib32gcc-s1 \
          libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses5-dev libncursesw5 libncursesw5-dev libreadline-dev libssl-dev \
          libtool lld lldb lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
          python2.7 python3 python3-pip python3-ply python3-docutils qemu-utils re2c rsync \
          scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd \
          zlib1g-dev file

    - name: Add swap (prevent OOM)
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile /mnt/swapfile
        sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Clone source
      run: |
        git clone --depth=1 https://github.com/derexiaon/immortalwrt-mt798x-rebase source

    - name: Update feeds
      run: |
        cd source
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load config
      run: |
        cd source
        cp ../defconfig/n60pro.config .config

        sed -i '/^CONFIG_TARGET_DEVICE_mediatek_/d' .config

        if [ "${{ matrix.profile }}" = "stock" ]; then
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro=y" >> .config
        else
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro-mtkuboot=y" >> .config
        fi

        make defconfig

    - name: Show selected config
      run: |
        cd source
        echo "==== DEVICE ===="
        grep '^CONFIG_TARGET_DEVICE_mediatek_' .config || true
        echo "==== CONNINFRA ===="
        grep '^CONFIG_PACKAGE_kmod-conninfra=' .config || true
        echo "==== MT WIFI ===="
        grep '^CONFIG_PACKAGE_kmod-mt_wifi=' .config || true
        echo "==== LUCI ===="
        grep '^CONFIG_PACKAGE_luci' .config || true

    - name: Download packages
      run: |
        cd source
        make download -j$(nproc)

    - name: Build firmware
      run: |
        cd source
        make -j$(nproc) || make -j1 V=s 2>&1 | tee build.log

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.profile }}
        path: source/build.log

    - name: Prepare artifact
      if: success()
      run: |
        cd source/bin/targets/*/*
        mkdir -p /tmp/artifacts

        if [ "${{ matrix.profile }}" = "stock" ]; then
          NAME="n60pro-stock"
        else
          NAME="n60pro-mtkuboot"
        fi

        cp * /tmp/artifacts/

        cd /tmp
        tar -czf firmware-${NAME}.tar.gz artifacts

    - name: Upload firmware
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.profile }}
        path: /tmp/firmware-*.tar.gz
