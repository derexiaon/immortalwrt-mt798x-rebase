name: Debug conninfra symbol

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install minimal deps
      run: |
        sudo apt update -qq
        sudo apt install -y build-essential libncurses5-dev python3 git wget xz-utils

    - name: Clone source
      run: |
        git clone --depth=1 https://github.com/derexiaon/immortalwrt-mt798x-rebase source

    - name: Minimal config
      run: |
        cd source
        cp ../defconfig/n60pro.config .config
        make defconfig

    - name: Download and prepare conninfra only
      run: |
        cd source
        make package/mtk/drivers/conninfra/download V=sc
        make package/mtk/drivers/conninfra/prepare V=sc

    - name: Find of_device_id symbol
      run: |
        CDIR=$(find source/build_dir -maxdepth 6 -type d -name 'conninfra' | head -1)
        echo "Dir: $CDIR"
        echo '--- .c files ---'
        find "$CDIR" -name '*.c' | sort
        echo '--- of_device_id matches ---'
        grep -rn 'of_device_id|MODULE_DEVICE_TABLE' "$CDIR" \
          --include='*.c' --include='*.h' | head -40 || echo 'NOT FOUND'
